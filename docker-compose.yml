services:
  postgres:
    image: postgres:16
    container_name: eshop-postgres
    environment:
      POSTGRES_DB: eshop
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: eshop
    ports:
      - "5432:5432"
    volumes:
      - eshop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: eshop-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Only environment-specific config here.
      # Everything else lives in application.properties.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eshop
      SPRING_DATASOURCE_USERNAME: eshop
      SPRING_DATASOURCE_PASSWORD: eshop
    ports:
      - "8080:8080"
    volumes:
      - eshop_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: eshop-frontend
    depends_on:
      - backend
    environment:
      API_INTERNAL_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  eshop_pg:
  eshop_uploads: