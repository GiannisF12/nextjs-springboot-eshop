services:
  postgres:
    image: postgres:16
    container_name: eshop-postgres
    environment:
      POSTGRES_DB: eshop
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: eshop
    ports:
      - "5432:5432"
    volumes:
      - eshop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: eshop-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Only environment-specific config here.
      # Everything else lives in application.properties.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eshop
      SPRING_DATASOURCE_USERNAME: eshop
      SPRING_DATASOURCE_PASSWORD: eshop
      # Dev convenience: when the products table is empty on startup,
      # insert a handful of demo products so the shop isn't empty after
      # a fresh DB reset. See DemoDataInitializer.java.
      # Turn this OFF for production.
      ESHOP_SEED_DEMO_PRODUCTS: "true"
      ESHOP_CORS_ALLOWED_ORIGIN: "http://localhost:3000"
    ports:
      - "8080:8080"
    volumes:
      - eshop_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    container_name: eshop-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  eshop_pg:
  eshop_uploads: