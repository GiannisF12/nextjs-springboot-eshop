spring.application.name=backend
server.port=8080

# CORS — override with ESHOP_CORS_ALLOWED_ORIGIN env var in production
eshop.cors.allowed-origin=http://localhost:3000

# Flyway owns the schema (via db/migration/V*.sql files).
# Hibernate only validates that entities match the existing schema —
# it never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
logging.level.org.springframework.security=INFO

# Treat empty JSON strings ("") as null when deserializing into enums/objects.
# Useful for optional form fields (e.g. gender, birthday) the frontend may
# send as "" instead of null when cleared.
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Include the "message" field of ResponseStatusException in the JSON error body
# so the frontend can surface meaningful validation errors to the user.
server.error.include-message=always

# Whether card payments are configured in THIS environment. The Stripe code
# exists, but a method with no keys behind it must not be offered — so this
# stays false by default and is flipped to true (via env
# ESHOP_PAYMENTS_CARD_AVAILABLE=true) only where the Stripe keys below are
# set. When true, the admin still has to enable card in Settings for it to
# appear at checkout.
eshop.payments.card-available=false

# Stripe keys — set via env in every real environment; never commit real
# values. Use test keys (sk_test_…) in dev, the client's live keys at launch.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Public base URL of the storefront, used to build Stripe success/cancel
# redirect URLs. Override per environment via ESHOP_APP_BASE_URL.
eshop.app.base-url=${ESHOP_APP_BASE_URL:http://localhost:3000}
