spring.application.name=backend
server.port=8080

# Flyway owns the schema (via db/migration/V*.sql files).
# Hibernate only validates that entities match the existing schema —
# it never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
logging.level.org.springframework.security=INFO

# Treat empty JSON strings ("") as null when deserializing into enums/objects.
# Useful for optional form fields (e.g. gender, birthday) the frontend may
# send as "" instead of null when cleared.
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Include the "message" field of ResponseStatusException in the JSON error body
# so the frontend can surface meaningful validation errors to the user.
server.error.include-message=always
