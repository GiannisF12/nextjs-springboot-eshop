# Production Docker Compose — for Coolify deployment
# Coolify handles HTTPS, routing, and domain configuration through its UI.
# Set DOMAIN_URL and DB_PASSWORD in Coolify's environment variables panel.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: eshop
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - eshop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eshop
      SPRING_DATASOURCE_USERNAME: eshop
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ESHOP_SEED_DEMO_PRODUCTS: "true"
      ESHOP_CORS_ALLOWED_ORIGIN: ${DOMAIN_URL}
    volumes:
      - eshop_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s   # δίνει χρόνο στο Spring Boot να ξεκινήσει

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy  # περιμένει το backend να είναι UP
    environment:
      API_INTERNAL_BASE_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  eshop_pg:
  eshop_uploads: